[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-footprint-langgraph"
version = "2.0.0"
description = "AI-powered carbon footprint estimation from Indian bank statements using LangGraph"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
